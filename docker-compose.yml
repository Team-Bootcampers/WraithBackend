name: corebackendkit

services:
  traefik:
    image: traefik:v3.0
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "8080:8080" # dashboard (dev only)
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - backbone
    restart: unless-stopped

  auth-postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AUTH_DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backbone
    restart: unless-stopped

  user-postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${USER_DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backbone
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP_NAME: user-service
    env_file: .env
    depends_on:
      user-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "require('net').connect(process.env.USER_GRPC_PORT||5001,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backbone
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP_NAME: ai-service
    env_file: .env
    healthcheck:
      test: [ "CMD", "node", "-e", "require('net').connect(process.env.AI_GRPC_PORT||5002,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backbone
    restart: unless-stopped

  hotel-postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${HOTEL_DB_USER}
      POSTGRES_PASSWORD: ${HOTEL_DB_PASSWORD}
      POSTGRES_DB: ${HOTEL_DB_NAME}
    volumes:
      - hotel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${HOTEL_DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backbone
    restart: unless-stopped

  hotel-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP_NAME: hotel-service
    env_file: .env
    depends_on:
      hotel-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "require('net').connect(process.env.HOTEL_GRPC_PORT||5003,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backbone
    restart: unless-stopped

  restaurant-postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${RESTAURANT_DB_USER}
      POSTGRES_PASSWORD: ${RESTAURANT_DB_PASSWORD}
      POSTGRES_DB: ${RESTAURANT_DB_NAME}
    volumes:
      - restaurant_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${RESTAURANT_DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backbone
    restart: unless-stopped

  restaurant-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP_NAME: restaurant-service
    env_file: .env
    depends_on:
      restaurant-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "require('net').connect(process.env.RESTAURANT_GRPC_PORT||5004,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backbone
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP_NAME: auth-service
    env_file: .env
    depends_on:
      auth-postgres:
        condition: service_healthy
      user-service:
        condition: service_started
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:'+(process.env.AUTH_HTTP_PORT||3001)+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backbone
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP_NAME: gateway
    env_file: .env
    depends_on:
      user-service:
        condition: service_started
      ai-service:
        condition: service_started
      hotel-service:
        condition: service_started
      restaurant-service:
        condition: service_started
      # Gateway bootstrap'ta auth-service spec'ini fetch eder;
      # auth-service sağlıklı olmadan başlamaz.
      auth-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:'+(process.env.GATEWAY_HTTP_PORT||3000)+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backbone
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    # QUIC/UDP bazı Docker ağlarında bloklanıyor; edge bağlantısı QUIC ile sürekli
    # başarısız olup (Error 1033) tünel hiç kurulamıyorsa http2'ye sabitlenir.
    command: tunnel --no-autoupdate --protocol http2 run --token eyJhIjoiY2MyZmEwZmU1NjUxYjM1ZGU0MDMxYTQ1ZDI0ZDBhYWIiLCJ0IjoiOTViNzA3NDItODI1MC00ODhjLWFjMGQtOTM5YjIyMzU4ZTMyIiwicyI6IlpUaGpOamN6WmpBdFpUbGhPUzAwTXpobExUZzNZekl0T0RBMFpUaGhNakJtTWpReiJ9
    networks:
      - backbone
    restart: unless-stopped
    depends_on:
      - traefik

networks:
  backbone:
    driver: bridge

volumes:
  auth_postgres_data:
  user_postgres_data:
  hotel_postgres_data:
  restaurant_postgres_data:
