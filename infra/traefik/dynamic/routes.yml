http:
  routers:
    # auth-service: api.localhost/auth/** → auth-service:3001
    # Kural: Tüm HTTP servisler api.localhost altında PathPrefix ile yönlendirilir.
    # Yeni servis eklerken bu dosyaya yeni bir router + service bloğu eklenir,
    # farklı subdomain (*.localhost) KULLANILMAZ.
    auth-service:
      rule: "Host(`wraithathon.gokhansal.com`) && PathPrefix(`/auth`)"
      entryPoints:
        - web
      service: auth-service
      middlewares:
        - default-headers

    # Swagger UI ve onun spec'i (/docs, /api-json) her zaman güncel kalmalı;
    # daha spesifik PathPrefix olduğu için Traefik bunu "gateway" router'ından
    # önce eşleştirir.
    gateway-docs:
      rule: "Host(`wraithathon.gokhansal.com`) && (PathPrefix(`/docs`) || Path(`/api-json`))"
      entryPoints:
        - web
      service: gateway
      middlewares:
        - default-headers
        - no-cache

    gateway:
      rule: "Host(`wraithathon.gokhansal.com`)"
      entryPoints:
        - web
      service: gateway
      middlewares:
        - default-headers

  services:
    auth-service:
      loadBalancer:
        servers:
          - url: "http://auth-service:3001"
        healthCheck:
          path: /health
          interval: "5s"
          timeout: "3s"

    gateway:
      loadBalancer:
        servers:
          - url: "http://gateway:3000"
        healthCheck:
          path: /health
          interval: "5s"
          timeout: "3s"
