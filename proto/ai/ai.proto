syntax = "proto3";

package ai;

// gateway bu servisi gRPC client olarak çağırır (ai-service = gRPC server).
// Stateless: veri tabanı yok, sadece Gemini'a prompt gönderip cevabı döner.
service AiService {
  rpc AnalyzeTravelPersonality (AnalyzeTravelPersonalityRequest) returns (AnalyzeTravelPersonalityResponse);
  rpc GenerateTravelRoute (GenerateTravelRouteRequest) returns (GenerateTravelRouteResponse);
  rpc RecommendRestaurants (RecommendRestaurantsRequest) returns (RecommendRestaurantsResponse);
  rpc RecommendAttractions (RecommendAttractionsRequest) returns (RecommendAttractionsResponse);
  rpc RecommendHotels (RecommendHotelsRequest) returns (RecommendHotelsResponse);
}

message AnalyzeTravelPersonalityRequest {
  // JSON.stringify edilmiş onboarding cevapları.
  string answers = 1;
}

message AnalyzeTravelPersonalityResponse {
  // Gemini'nin ürettiği analiz paragrafı (düz metin).
  string analysis = 1;
}

message GenerateTravelRouteRequest {
  string country = 1;
  string city = 2;
  // JSON.stringify edilmiş kişilik/onboarding özellikleri.
  string personality = 3;
}

message GenerateTravelRouteResponse {
  // JSON.stringify edilmiş { gezilecek_yerler, restoranlar } sonucu.
  string result = 1;
}

message RecommendRestaurantsRequest {
  string country = 1;
  string city = 2;
  // Kullanıcının seyahat kişiliği analiz metni.
  string personalityAnalysis = 3;
  // JSON.stringify edilmiş aday restoran listesi (restaurant-service'ten gelen RestaurantResponse[]).
  string restaurants = 4;
}

message RecommendRestaurantsResponse {
  // JSON.stringify edilmiş, kişiliğe uygun seçilmiş restoran listesi (RestaurantResponse[] ile aynı şema).
  string result = 1;
}

message RecommendAttractionsRequest {
  string country = 1;
  string city = 2;
  // Kullanıcının seyahat kişiliği analiz metni.
  string personalityAnalysis = 3;
  // JSON.stringify edilmiş aday gezilecek yer listesi (attraction-service'ten gelen AttractionResponse[]).
  string attractions = 4;
}

message RecommendAttractionsResponse {
  // JSON.stringify edilmiş, kişiliğe uygun seçilmiş gezilecek yer listesi (AttractionResponse[] ile aynı şema).
  string result = 1;
}

message RecommendHotelsRequest {
  string country = 1;
  string city = 2;
  // Kullanıcının seyahat kişiliği analiz metni.
  string personalityAnalysis = 3;
  // JSON.stringify edilmiş aday otel listesi (hotel-service'ten gelen HotelResponse[]).
  string hotels = 4;
}

message RecommendHotelsResponse {
  // JSON.stringify edilmiş, kişiliğe uygun seçilmiş otel listesi (HotelResponse[] ile aynı şema).
  string result = 1;
}

// Onboarding'de üretilen karakter analizine ve kullanıcının seçtiği durak/otel/mekan/restoran
// verilerine dayanarak gün gün, saat saat seyahat planı üretir.
service TripPlanningService {
  rpc PlanTrip (PlanTripRequest) returns (PlanTripResponse);
}

message PlanTripRequest {
  // Onboarding'de Gemini'nin ürettiği seyahat kişiliği analiz metni.
  string characterAnalysis = 1;
  // JSON.stringify edilmiş onboarding cevapları (OnboardingAnswersDto).
  string onboardingAnswers = 2;
  // JSON.stringify edilmiş seyahat verisi (TripDto: travelerCount + stops[]).
  string trip = 3;
}

message PlanTripResponse {
  // JSON.stringify edilmiş TripPlanDto sonucu.
  string result = 1;
}
