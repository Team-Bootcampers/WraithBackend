syntax = "proto3";

package attraction;

// gateway bu servisi gRPC client olarak çağırır (attraction-service = gRPC server).
service AttractionService {
  rpc ListAttractions (ListAttractionsRequest) returns (ListAttractionsResponse);
  rpc GetAttractionById (GetAttractionByIdRequest) returns (AttractionResponse);
}

message ListAttractionsRequest {
  string country = 1;
  string city = 2;
}

message GetAttractionByIdRequest {
  string id = 1;
}

message ListAttractionsResponse {
  repeated AttractionResponse attractions = 1;
  int32 total = 2;
}

message Price {
  double amount = 1;
  string currency = 2;
  string period = 3;
}

message AttractionResponse {
  string id = 1;
  string name = 2;
  double rating = 3;
  string address = 4;
  Price price = 5;
  repeated string images = 6;
  string country = 7;
  string cityName = 8;
}
