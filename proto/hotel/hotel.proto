syntax = "proto3";

package hotel;

// gateway bu servisi gRPC client olarak çağırır (hotel-service = gRPC server).
service HotelService {
  rpc ListHotels (ListHotelsRequest) returns (ListHotelsResponse);
  rpc GetHotelById (GetHotelByIdRequest) returns (HotelResponse);
}

message ListHotelsRequest {
  string country = 1;
  string city = 2;
}

message GetHotelByIdRequest {
  string id = 1;
}

message ListHotelsResponse {
  repeated HotelResponse hotels = 1;
  int32 total = 2;
}

message Price {
  double amount = 1;
  string currency = 2;
  string period = 3;
}

message HotelResponse {
  string id = 1;
  string name = 2;
  double rating = 3;
  string address = 4;
  Price price = 5;
  repeated string images = 6;
  string country = 7;
  string cityName = 8;
}
