syntax = "proto3";

package restaurant;

// gateway bu servisi gRPC client olarak çağırır (restaurant-service = gRPC server).
service RestaurantService {
  rpc ListRestaurants (ListRestaurantsRequest) returns (ListRestaurantsResponse);
  rpc GetRestaurantById (GetRestaurantByIdRequest) returns (RestaurantResponse);
}

message ListRestaurantsRequest {
  string country = 1;
  string city = 2;
}

message GetRestaurantByIdRequest {
  string id = 1;
}

message ListRestaurantsResponse {
  repeated RestaurantResponse restaurants = 1;
  int32 total = 2;
}

message Price {
  double amount = 1;
  string currency = 2;
  string period = 3;
}

message RestaurantResponse {
  string id = 1;
  string name = 2;
  double rating = 3;
  string address = 4;
  Price price = 5;
  repeated string images = 6;
  string country = 7;
  string cityName = 8;
}
